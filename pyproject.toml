[project]
name = "video-highlight"
version = "0.1.0"
description = "Extract highlight clips from livestream danmaku data."
authors = [
    { name = "yuhaikun", email = "2295987338@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "pandas-stubs~=2.3.3",
    "streamlit>=1.61.1",
    "plotly>=6.9.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "torch",
    "torchaudio",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
app = ["streamlit>=1.40", "plotly>=5.20"]
dev = ["pytest>=7.0", "matplotlib>=3.7", "kaleido>=0.2"]

[project.scripts]
video-highlight = "video_highlight:main"

# 关键配置开始
[[tool.uv.index]]
name = "pytorch-aliyun"  # 这个名称可以自定义，但必须与下方 sources 中一致
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu118"
explicit = true         # 必须为 true，防止 uv 用此源去查找其他包

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.uv.sources]
torch = { index = "pytorch-aliyun" }      # 这里的名称必须与上方的 name 完全一致
torchaudio = { index = "pytorch-aliyun" } # 这里的名称必须与上方的 name 完全一致
